# Keeps Valentino's knowledge in step with the published site: on every push that changes a page, the chat answers
# or the facts, it rebuilds the plain text and uploads it to Workers KV. The worker picks it up within a few minutes,
# with no redeploy. Needs CLOUDFLARE_API_TOKEN (Workers KV Storage: Edit only) and CLOUDFLARE_ACCOUNT_ID in Actions secrets.
name: Update Valentino's knowledge

on:
  push:
    branches: [main]
    paths: ["*.html", "projects/**", "chat.js", "worker/facts.md", "worker/build-knowledge.mjs", ".github/workflows/valentino.yml"]
  workflow_dispatch:

concurrency: valentino-knowledge

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      NAMESPACE_ID: ca4c54ed3e7148e1a8796dc047b34011
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build knowledge from the pages
        run: node worker/build-knowledge.mjs
      - name: Upload to Workers KV
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$NAMESPACE_ID/values/knowledge" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: text/plain; charset=utf-8" \
            --data-binary @worker/knowledge.txt
