name = "valentino"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# 10 questions per visitor (IP) per minute. The monthly spend cap is set in the Claude Console.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The API key is a secret, set with `npx wrangler secret put ANTHROPIC_API_KEY`. Never put it in this file.
