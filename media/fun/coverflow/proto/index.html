<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coverflow prototype</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Coverflow for visionOS, playable. Three scenes in one stage, drawn at 1280 × 800 and scaled to fit:
       1. the library window in the room, 2. Coverflow (real 3D covers you can flip), 3. an immersive race in three.js
       when the Formula 1 theme plays. The living room photo and the F1 art come from Anoushka's Figma file; the other environments are free Unsplash photos. */
    html, body { margin: 0; height: 100%; overflow: clip; background: #111; font-family: -apple-system, "SF Pro Text", Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; user-select: none; }
    * { box-sizing: border-box; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    .stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px; transform-origin: 0 0; overflow: hidden; }
    .room { position: absolute; inset: -20px; transition: filter .8s ease, transform 1.2s cubic-bezier(.3, 0, .2, 1); }
    /* Environments, as in visionOS: each is a photo layer that crossfades in */
    .room i { position: absolute; inset: 0; background: var(--img) center 55% / cover; opacity: 0; transition: opacity .9s ease; }
    .room i.on { opacity: 1; }
    .envs { position: absolute; left: 40px; bottom: 40px; z-index: 5; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 26px; transition: opacity .3s; }
    .envs button { width: 36px; height: 36px; border-radius: 50%; background: var(--img) center / cover; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); transition: box-shadow .2s, scale .2s; }
    .envs button:hover { scale: 1.08; }
    .envs button.on { box-shadow: 0 0 0 2px #fff; }
    .envs span { padding: 0 10px 0 6px; font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, .85); white-space: nowrap; }
    .stage.race .envs { opacity: 0; pointer-events: none; }
    .stage.cf .room { filter: brightness(.82); }
    .glass { background: rgba(98, 98, 104, .42); backdrop-filter: blur(36px) saturate(160%); -webkit-backdrop-filter: blur(36px) saturate(160%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), inset 0 0 0 1px rgba(255, 255, 255, .1), 0 30px 60px -30px rgba(0, 0, 0, .5); }

    /* ---------- 1. Library window ---------- */
    .win { position: absolute; left: 230px; top: 96px; width: 820px; height: 520px; border-radius: 44px; display: flex; overflow: hidden;
      transition: opacity .5s ease, transform .7s cubic-bezier(.3, 0, .2, 1), filter .5s ease; }
    .stage.cf .win, .stage.race .win { opacity: 0; transform: scale(.92) translateY(-12px); filter: blur(8px); pointer-events: none; }
    .side { width: 220px; padding: 26px 14px; background: rgba(255, 255, 255, .06); display: flex; flex-direction: column; gap: 4px; }
    .side h1 { margin: 0 10px 2px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
    .side .sub { margin: 0 10px 18px; font-size: 13px; color: rgba(255, 255, 255, .6); }
    .side a { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 20px; font-size: 15px; color: rgba(255, 255, 255, .92); }
    .side a.on { background: rgba(255, 255, 255, .18); }
    .side svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
    .main { flex: 1; padding: 26px 28px; display: flex; flex-direction: column; min-width: 0; }
    .head { display: flex; align-items: flex-start; justify-content: space-between; }
    .head h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
    .head p { margin: 2px 0 0; font-size: 13px; color: rgba(255, 255, 255, .6); }
    .views { display: flex; gap: 2px; padding: 3px; border-radius: 22px; background: rgba(0, 0, 0, .18); }
    .views button { display: grid; place-items: center; width: 44px; height: 34px; border-radius: 18px; color: rgba(255, 255, 255, .75); transition: background .2s, color .2s; }
    .views button.on { background: rgba(255, 255, 255, .22); color: #fff; }
    .views button:hover { color: #fff; }
    .views svg { width: 22px; height: 18px; }
    .search { display: flex; align-items: center; gap: 8px; height: 38px; margin: 18px 0 20px; padding: 0 14px; border-radius: 19px; background: rgba(0, 0, 0, .16); font-size: 14px; color: rgba(255, 255, 255, .55); }
    .search svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 16px; }
    .grid figure { margin: 0; }
    .grid img { display: block; width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; }
    .grid figcaption { margin-top: 7px; font-size: 13px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .grid figcaption span { display: block; color: rgba(255, 255, 255, .58); }
    .nudge { position: absolute; right: 232px; top: 66px; padding: 9px 16px; border-radius: 18px; background: #fff; color: #1d1d22; font-size: 15px; font-weight: 600;
      box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .45); animation: bob 1.6s ease-in-out infinite; transition: opacity .3s; pointer-events: none; }
    /* Until Coverflow is tried, its button glows and pulses */
    .stage:not(.used) #toCf { background: rgba(255, 255, 255, .28); color: #fff; animation: ping 1.8s ease-out infinite; }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .55); } 80%, 100% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); } }
    .nudge::after { content: ""; position: absolute; right: 26px; bottom: -5px; width: 10px; height: 10px; background: inherit; rotate: 45deg; }
    .stage.cf .nudge, .stage.used .nudge { opacity: 0; }
    @keyframes bob { 50% { translate: 0 -4px; } }

    /* ---------- 2. Coverflow ---------- */
    .flow { position: absolute; left: 0; right: 0; top: 150px; height: 440px; perspective: 1300px; pointer-events: none; }
    .stage.cf .flow { pointer-events: auto; }
    /* Each cover is a glass card with its title and artist inside, as in Anoushka's design */
    .cover { position: absolute; left: 50%; top: 0; width: 290px; margin-left: -145px; text-align: center; transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.25, .8, .25, 1), opacity .5s ease, filter .55s ease; opacity: 0; cursor: pointer; }
    /* The glass card has two faces; Formula 1 turns over once its theme plays, to offer the race */
    /* A symmetric ease, so the card is edge-on exactly halfway, when the faces swap; it lifts a little as it turns */
    .turn { position: relative; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.45, 0, .55, 1); }
    .cover.over .turn { transform: rotateY(180deg); }
    .cover.over .turn { animation: lift .7s cubic-bezier(.45, 0, .55, 1); }
    @keyframes lift { 50% { translate: 0 0 60px; } }
    .front, .rear { filter: brightness(var(--dim, 1)); transition: filter .55s ease; padding: 12px 12px 16px; border-radius: 30px;
      background: linear-gradient(180deg, #8E8E95, #727279); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 0 0 1px rgba(255, 255, 255, .14), 0 30px 50px -24px rgba(0, 0, 0, .55); }
    .rear { position: absolute; inset: 0; transform: rotateY(180deg); display: flex; flex-direction: column; opacity: 0; }
    /* Faces swap halfway through the turn (Chrome drops backface-visibility on the side covers, so this is done by hand) */
    .front, .rear { transition: filter .55s ease, opacity 0s linear .35s; }
    .cover.over .front { opacity: 0; }
    .cover.over .rear { opacity: 1; }
    /* The back, styled like an Apple Music feature card: the art, a dark fade, and a white pill */
    .rear .art { position: relative; aspect-ratio: 1; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; padding: 18px; text-align: left; }
    .rear .art { background: #000; }
    .rear .logo { position: absolute; left: 0; right: 0; top: 26px; height: 74px; overflow: hidden; }   /* just the F1 mark, cropped from the cover and clear of the text */
    .rear .logo img { position: absolute; left: 12%; top: -62px; width: 76%; }
    .rear .art::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, #000 72%); }
    .rear .art small { position: relative; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .65); }
    .rear .art p { position: relative; margin: 3px 0 14px; font-size: 21px; font-weight: 600; line-height: 1.2; letter-spacing: -.015em; }
    .rear .go { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 18px 0 15px; border-radius: 999px; background: #fff; color: #000;
      font-size: 15px; font-weight: 600; transition: scale .2s cubic-bezier(.3, .7, .3, 1.4), background .2s; }
    .rear .go svg { width: 13px; height: 13px; fill: currentColor; }
    .cover.over:hover .go { scale: 1.04; background: #f2f2f5; }
    .stage.cf .cover { opacity: 1; }
    .cover img { display: block; width: 100%; aspect-ratio: 1; border-radius: 20px; object-fit: cover; }
    .cover b { display: block; margin-top: 12px; font-size: 21px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cover span { display: block; margin-top: 2px; font-size: 18px; color: rgba(255, 255, 255, .58); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .label { display: none; }
    .stage.cf .label { opacity: 1; }
    .label b { display: block; font-size: 22px; font-weight: 600; }
    .label span { font-size: 16px; color: rgba(255, 255, 255, .7); }
    .hint { position: absolute; left: 50%; top: 100px; translate: -50% 0; padding: 7px 14px; border-radius: 16px; background: rgba(20, 20, 24, .38); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); white-space: nowrap; font-size: 14px; color: #fff; opacity: 0; transition: opacity .4s; }
    .stage.cf .hint { opacity: 1; }
    .back { position: absolute; z-index: 6; left: 40px; top: 40px; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s; }
    .back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .stage.cf .back, .stage.race .back { opacity: 1; pointer-events: auto; }

    /* ---------- Play bar (an ornament under everything) ---------- */
    .bar { position: absolute; left: 50%; top: 640px; translate: -50% 0; height: 60px; padding: 0 10px 0 18px; border-radius: 30px; display: flex; align-items: center; gap: 16px; z-index: 5; transition: top .7s cubic-bezier(.3, 0, .2, 1); }
    .stage.race .bar { top: 700px; }
    .bar > button { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; }
    .bar > button:hover { background: rgba(255, 255, 255, .14); }
    .bar svg { width: 20px; height: 20px; fill: #fff; }
    .now { display: flex; align-items: center; gap: 10px; width: 250px; height: 44px; padding: 0 12px 0 6px; border-radius: 14px; background: rgba(0, 0, 0, .16); }
    .now img { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; }
    .now div { min-width: 0; font-size: 12px; line-height: 1.3; }
    .now b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now span { color: rgba(255, 255, 255, .6); }
    .prog { position: absolute; left: 164px; bottom: 6px; width: 228px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .18); overflow: hidden; }
    .prog i { display: block; height: 100%; width: 0; background: rgba(255, 255, 255, .85); }

    /* ---------- 3. The race ---------- */
    #race { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease; z-index: 2; pointer-events: none; }
    .stage.race #race { opacity: 1; pointer-events: auto; }
    .stage.race .room { transform: scale(1.15); filter: brightness(.3) blur(6px); }
    .stage.race .cover, .stage.race .label, .stage.race .hint { opacity: 0 !important; pointer-events: none; }
    .card { position: absolute; left: 44px; top: 96px; width: 170px; padding: 10px 10px 12px; border-radius: 26px; text-align: center; z-index: 4;
      opacity: 0; transform: translateY(30px) scale(.9); transition: opacity .6s ease .5s, transform .8s cubic-bezier(.2, .8, .2, 1) .5s; pointer-events: none; }
    .stage.race .card { opacity: 1; transform: none; }
    .card img { width: 100%; border-radius: 18px; display: block; }
    .card b { display: block; margin-top: 9px; font-size: 15px; font-weight: 600; }
    .card span { font-size: 13px; color: rgba(255, 255, 255, .7); }
    .stage.race .bar { top: 24px; }
    /* Max's onboard: the halo and his steering wheel fade in once the camera is in the cockpit */
    .onboard { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .5s ease; }
    .stage.race.inside .onboard { opacity: 1; }
    .halo { position: absolute; inset: 0; width: 100%; height: 100%; }
    .wheel { position: absolute; left: 50%; bottom: -34px; width: 420px; margin-left: -210px; transform-origin: 50% 70%; }
    .wheel svg { display: block; width: 100%; }
    .wheel .dash { position: absolute; left: 50%; top: 62px; width: 132px; margin-left: -66px; text-align: center; font-variant-numeric: tabular-nums; }
    .wheel .dash b { display: block; font-size: 46px; font-weight: 700; line-height: 1; color: #fff; }
    .wheel .dash span { display: block; margin-top: 4px; font-size: 13px; font-weight: 600; letter-spacing: .06em; color: #FFC800; }
    /* Timing tower, F1 broadcast style */
    .tower { position: absolute; right: 40px; top: 40px; z-index: 4; width: 150px; padding: 8px 0; border-radius: 14px; background: rgba(10, 10, 14, .72); font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity .5s ease 1s; font-variant-numeric: tabular-nums; }
    .stage.race .tower { opacity: 1; }
    .tower p { margin: 0 0 4px; padding: 0 12px; font-size: 10px; letter-spacing: .14em; color: rgba(255, 255, 255, .55); }
    .tower li { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 12px; transition: background .3s; }
    .tower li i { width: 3px; height: 13px; border-radius: 2px; }
    .tower li em { width: 16px; font-style: normal; color: rgba(255, 255, 255, .55); text-align: right; }
    .tower li.me { background: rgba(255, 200, 0, .16); }
    .tower ol { margin: 0; padding: 0; list-style: none; }
    .steer { position: absolute; left: 44px; bottom: 44px; z-index: 4; font-size: 13px; color: rgba(255, 255, 255, .8); opacity: 0; transition: opacity .5s ease 1.2s; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); }
    .stage.race .steer { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .cover, .win, .room, .card { transition-duration: .01s !important; } .nudge, #toCf { animation: none !important; } }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="room" id="room"></div>
    <div class="envs glass" id="envs"></div>

    <!-- 1. Library -->
    <section class="win glass" aria-label="Apple Music library">
      <nav class="side">
        <h1>Library</h1><p class="sub">All Music</p>
        <a><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4l2.5 2"/></svg>Recently Added</a>
        <a><svg viewBox="0 0 20 20"><path d="M12.5 3.5a3 3 0 1 1 4 4l-7 6-3-3z"/><path d="M6.5 10.5 3 17l6.5-3.5"/></svg>Artists</a>
        <a><svg viewBox="0 0 20 20"><rect x="4" y="5" width="12" height="12" rx="2"/><path d="M6 3h8"/></svg>Albums</a>
        <a class="on"><svg viewBox="0 0 20 20"><path d="M8 15V4l8-1.5v11"/><circle cx="6" cy="15" r="2"/><circle cx="14" cy="13.5" r="2"/></svg>Songs</a>
        <a><svg viewBox="0 0 20 20"><path d="M10 16.5s-6.5-3.8-6.5-8.2A3.5 3.5 0 0 1 10 6.5a3.5 3.5 0 0 1 6.5 1.8c0 4.4-6.5 8.2-6.5 8.2z"/></svg>Made For You</a>
      </nav>
      <div class="main">
        <div class="head">
          <div><h2>Songs</h2><p>6 Songs</p></div>
          <div class="views" role="group" aria-label="View">
            <button class="on" aria-label="Grid" aria-pressed="true"><svg viewBox="0 0 22 18" fill="currentColor"><rect x="2" y="1" width="7.5" height="7" rx="2"/><rect x="12.5" y="1" width="7.5" height="7" rx="2"/><rect x="2" y="10" width="7.5" height="7" rx="2"/><rect x="12.5" y="10" width="7.5" height="7" rx="2"/></svg></button>
            <!-- Her Coverflow icon (active state) -->
            <button id="toCf" aria-label="Coverflow" aria-pressed="false"><svg viewBox="0 0 741 359" fill="currentColor"><rect x="191" width="358" height="358" rx="49"/><path d="M645 26c0-10-12-16-20-9l-47 39c-3 2-5 6-5 9v228c0 3 2 7 5 9l47 39c8 7 20 1 20-9z"/><path d="M740 54c0-11-13-17-21-9l-47 47c-2 2-3 5-3 9v157c0 3 1 7 3 9l47 47c8 8 21 2 21-9z"/><path d="M96 26c0-10 12-16 20-9l47 39c3 2 5 6 5 9v228c0 3-2 7-5 9l-47 39c-8 7-20 1-20-9z"/><path d="M1 54c0-11 13-17 21-9l47 47c2 2 3 5 3 9v157c0 3-1 7-3 9l-47 47c-8 8-21 2-21-9z"/></svg></button>
          </div>
        </div>
        <div class="search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>Search in Songs</div>
        <div class="grid" id="grid"></div>
      </div>
    </section>
    <div class="nudge">Try Coverflow</div>

    <!-- 2. Coverflow -->
    <button class="back glass" id="back"><svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg><span>Library</span></button>
    <p class="hint" id="hint">Swipe, drag or use the arrow keys. Click the middle cover to play it.</p>
    <div class="flow" id="flow"></div>
    <div class="label" id="label"><b></b><span></span></div>

    <!-- 3. Race -->
    <canvas id="race"></canvas>
    <div class="card glass" id="card"><img src="f1.webp" alt=""><b>Formula 1 Theme</b><span>Brian Tyler</span></div>
    <div class="onboard" aria-hidden="true">
      <svg class="halo" viewBox="0 0 1280 800" preserveAspectRatio="none"><defs><linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="#050507"/><stop offset=".45" stop-color="#1c1d22"/><stop offset=".55" stop-color="#1c1d22"/><stop offset="1" stop-color="#050507"/></linearGradient></defs>
        <path d="M150 0 Q640 210 1130 0 L1180 0 Q640 270 100 0 Z" fill="#08080b"/><path d="M626 0 L654 0 L668 330 L612 330 Z" fill="url(#hg)"/></svg>
      <div class="wheel" id="wheel">
        <svg viewBox="0 0 420 230"><path d="M40 70 Q40 40 70 38 L350 38 Q380 40 380 70 L392 150 Q396 196 352 206 L300 206 Q280 206 272 190 L262 170 L158 170 L148 190 Q140 206 120 206 L68 206 Q24 196 28 150 Z" fill="#17181c"/>
          <path d="M40 70 Q40 40 70 38 L110 38 L92 206 L68 206 Q24 196 28 150 Z M380 70 Q380 40 350 38 L310 38 L328 206 L352 206 Q396 196 392 150 Z" fill="#0b0b0d"/>
          <rect x="138" y="54" width="144" height="94" rx="10" fill="#050507" stroke="#2a2b31"/>
          <g id="leds"></g>
          <circle cx="118" cy="120" r="9" fill="#D5133A"/><circle cx="302" cy="120" r="9" fill="#FFC800"/><circle cx="118" cy="152" r="7" fill="#2a2b31"/><circle cx="302" cy="152" r="7" fill="#2a2b31"/></svg>
        <div class="dash"><b id="gear">N</b><span><span id="kmh" style="display:inline;color:#fff">0</span> KM/H</span></div>
      </div>
    </div>
    <div class="tower"><p>POSITION</p><ol id="tower"></ol></div>
    <p class="steer">Move your pointer, or use ← → to steer</p>

    <div class="bar glass">
      <button aria-label="Previous" id="prev"><svg viewBox="0 0 20 20"><path d="M9 5v10L2 10zM17 5v10l-7-5z"/></svg></button>
      <button aria-label="Play" id="play"><svg viewBox="0 0 20 20" id="playIcon"><path d="M5 3.5v13l11-6.5z"/></svg></button>
      <button aria-label="Next" id="next"><svg viewBox="0 0 20 20"><path d="M11 5v10l7-5zM3 5v10l7-5z"/></svg></button>
      <div class="now"><img id="nowImg" src="" alt=""><div><b id="nowT"></b><span id="nowA"></span></div></div>
      <span class="prog"><i id="progBar"></i></span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Songs play Apple Music's official 30-second previews (from the iTunes Search API); the art is Apple's too,
    // except the Formula 1 cover, which comes from Anoushka's Figma file.
    const ART = (path) => `https://is1-ssl.mzstatic.com/image/thumb/${path}/600x600bb.jpg`;
    const PREVIEW = (path) => `https://audio-ssl.itunes.apple.com/itunes-assets/${path}.plus.aac.p.m4a`;
    const ALBUMS = [
      { t: "As It Was", a: "Harry Styles", img: ART("Music126/v4/2a/19/fb/2a19fb85-2f70-9e44-f2a9-82abe679b88e/886449990061.jpg"), src: PREVIEW("AudioPreview221/v4/67/10/16/67101606-3869-ca44-6c03-e13d6322cb51/mzaf_1135399237022217274") },
      { t: "Heat Waves", a: "Glass Animals", img: ART("Music115/v4/da/8b/77/da8b7731-6f4f-eacf-5e74-8b23389eefa1/20UMGIM03371.rgb.jpg"), src: PREVIEW("AudioPreview221/v4/a3/4c/b9/a34cb911-40fc-5f0c-e862-14bd171a77aa/mzaf_384792072030970151") },
      { t: "Blinding Lights", a: "The Weeknd", img: ART("Music125/v4/6f/bc/e6/6fbce6c4-c38c-72d8-4fd0-66cfff32f679/20UMGIM12176.rgb.jpg"), src: PREVIEW("AudioPreview211/v4/19/d6/60/19d660ff-e3a9-8377-15a3-ce4b28e89cac/mzaf_18422426156481158187") },

          const len = 1 + speed * 6; pos.set([p.x + x * .2, p.y, p.z, p.x + x * .2, p.y, p.z - len], i * 6); });
        streakGeo.attributes.position.needsUpdate = true;
        streaks.material.opacity = .45 * speed;
        renderer.render(scene, cam);
        // Wheel display: gear and revs from the speed; the tower orders the grid by who's furthest up the road
        const kmh = Math.round(312 * speed), gear = kmh < 8 ? 0 : Math.min(8, 1 + Math.floor(kmh / 40)), rev = gear === 8 ? (kmh - 280) / 32 : gear ? (kmh % 40) / 40 : 0;
        $("#kmh").textContent = kmh; $("#gear").textContent = gear ? gear : "N";
        leds.forEach((l, i) => l.setAttribute("fill", i < Math.round(rev * 15) ? l.dataset.c : "#26272c"));
        if ((tick += dt) > .25) { tick = 0;
          const order = [...rivals.map((c) => ({ code: c.userData.d.code, hex: c.userData.d.hex, z: c.position.z })), { code: "VER", hex: "#3671C6", z: -.6, me: true }].sort((a, b) => a.z - b.z);
          $("#tower").innerHTML = order.map((o, i) => `<li${o.me ? ' class="me"' : ""}><em>${i + 1}</em><i style="background:${o.hex}"></i>${o.code}</li>`).join(""); }
        if (on || speed > .01) raf = requestAnimationFrame(frame); else raf = 0;
      }
      // A soft engine hum under the theme: two detuned saws through a low-pass, pitched by speed
      let ac, eng, engGain;
      function hum(level) {
        try {
          if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 520; engGain = ac.createGain(); engGain.gain.value = 0;
            eng = [0, 7].map((d) => { const o = ac.createOscillator(); o.type = "sawtooth"; o.detune.value = d; o.connect(lp); o.start(); return o; }); lp.connect(engGain); engGain.connect(ac.destination); }
          ac.resume(); engGain.gain.setTargetAtTime(level, ac.currentTime, .4);
        } catch {}
      }
      setInterval(() => { if (eng) eng.forEach((o) => o.frequency.setTargetAtTime(48 + 70 * speed, ac.currentTime, .2)); }, 100);
      return {
        start() { on = true; intro = 0; hum(.035); if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } },
        stop() { on = false; hum(0); $(".stage").classList.remove("inside"); },
      };
    })();
  </script>
