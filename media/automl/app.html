<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1456">
  <title>AutoML Evaluations app</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Recreated screens for the AutoML Evaluations case study. Layouts follow the shipped Evaluations pages and the old
       Compare Models page; the pet-photo evaluations, their numbers and prompts are made up so the comparison has a winner.
       Metrics are computed from each made-up confusion matrix, so they agree with each other.
       Drawn at 1456px wide; the case study scales it down. Type is set large so it stays readable once scaled.
       ?v= picks the view: list, compare, results, info, before, tour (hero loop). A parent page can switch with postMessage({ v }). */
    :root {
      --blue: #1F6BFF; --blue-soft: #EEF3FF; --blue-mid: #BFD3FF;
      --ink: #14171F; --ink-2: #474D5C; --ink-3: #8A90A0; --line: #E3E6EC; --bg: #fff; --tint: #F6F8FB;
      --green: #1F8A4C; --green-soft: #E6F6EC; --amber: #B26A00; --amber-soft: #FFF3DD;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { width: 1456px; background: var(--bg); color: var(--ink); font: 400 19px/1.4 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; }
    svg { flex: none; }
    #app { position: relative; height: 100%; }
    .view { position: absolute; inset: 0; overflow: hidden; background: var(--bg); transition: opacity .5s ease; }
    .scroll .view { overflow-y: auto; overscroll-behavior: contain; }
    .view.out { opacity: 0; pointer-events: none; }
    .tour .view { transition: opacity .35s ease .35s; }
    .tour .view.out { transition: opacity .35s ease; }

    /* ---------- Shipped chrome ---------- */
    .top { height: 76px; display: flex; align-items: center; gap: 14px; padding: 0 32px; border-bottom: 1px solid var(--line); }
    /* The Deploy AutoML product lockup, from the Figma file */
    .logo { display: flex; align-items: center; }
    .logo svg { display: block; }
    .top .sp { flex: 1; }
    .chip { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 17px; font-weight: 500; }
    .who { display: flex; align-items: center; gap: 12px; padding-left: 18px; margin-left: 4px; border-left: 1px solid var(--line); font-size: 16px; line-height: 1.2; }
    .who b { font-weight: 500; } .who span { color: var(--ink-3); }
    .av { width: 40px; height: 40px; border-radius: 50%; background: var(--tint); border: 1px solid var(--line); display: grid; place-items: center; font-size: 14px; color: var(--ink-2); }
    .body { display: flex; height: calc(100% - 76px); }
    .rail { width: 78px; flex: none; border-right: 1px solid var(--line); padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; }
    .rail .sp { flex: 1; }
    .rail hr { width: 30px; border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
    .nav-i { width: 42px; height: 42px; display: grid; place-items: center; color: #0D111B; border-radius: 10px; }
    .nav-i svg { width: 21px; height: 21px; }
    .nav-i.on { color: #206CFD; }
    .page { flex: 1; padding: 26px 44px; min-width: 0; }
    .crumb { color: var(--ink-3); font-size: 17px; margin-bottom: 14px; } .crumb b { color: var(--ink); font-weight: 400; margin-left: 10px; }
    .head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.015em; white-space: nowrap; }
    .head .sp { flex: 1; }
    .sub { color: var(--ink-3); font-size: 18px; margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 15px; border: 1px solid #D5D9E1; border-radius: 10px; background: #fff; font-size: 18px; font-weight: 500; white-space: nowrap; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.icon { width: 46px; padding: 0; justify-content: center; }
    .btn:disabled { opacity: .45; cursor: default; }
    .pill { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 15px; font-weight: 500; }
    .ok { background: var(--green-soft); color: var(--green); } .run { background: var(--amber-soft); color: var(--amber); }
    .card { border: 1px solid var(--line); border-radius: 14px; }
    .muted { color: var(--ink-3); }
    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .tabs button { border: 0; background: none; padding: 8px 10px 10px; font-size: 18px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tabs button.on { color: var(--ink); border-color: var(--ink); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 12px; vertical-align: 2px; }

    /* ---------- List ---------- */
    .tools { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    .search { width: 420px; height: 46px; border: 1px solid #D5D9E1; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--ink-3); font-size: 17px; }
    .toggle { display: inline-flex; align-items: center; gap: 12px; margin-left: auto; color: var(--ink-3); font-size: 17px; }
    .toggle i { width: 44px; height: 26px; border-radius: 13px; background: #D5D9E1; position: relative; }
    .toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .grid { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .grid th { text-align: left; font-weight: 500; font-size: 17px; padding: 18px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .grid td { padding: 14px 16px; font-size: 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .grid tr:last-child td { border-bottom: 0; }
    .grid th + th, .grid td + td { border-left: 1px solid var(--line); }
    .grid tbody tr { transition: background .15s; }
    .grid tbody tr.sel, .grid tbody tr:hover { background: var(--blue-soft); }
    .id { display: block; font-size: 14px; color: var(--ink-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .box { width: 22px; height: 22px; border: 1.5px solid #B9BFCB; border-radius: 5px; background: #fff; display: inline-grid; place-items: center; padding: 0; vertical-align: middle; }
    .box.on { background: var(--blue); border-color: var(--blue); }
    .box.on::after { content: ""; width: 10px; height: 6px; border: 2.5px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
    .num { font-variant-numeric: tabular-nums; }
    /* Evaluation names open their results */
    .open { border: 0; background: none; padding: 0; font: inherit; color: var(--ink); text-align: left; text-decoration: underline; text-decoration-color: #C5CAD4; text-underline-offset: 4px; }
    .open:hover { color: var(--blue); text-decoration-color: currentColor; }
    /* Keep the colour dot and the evaluation name on one line */
    .grid td:has(> .dot) { white-space: nowrap; }
    .open { white-space: nowrap; }
    .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; color: var(--ink-3); font-size: 17px; }
    .hint { color: var(--blue); font-weight: 500; }

    /* ---------- Compare ---------- */
    .split { display: grid; grid-template-columns: 200px 1fr; gap: 22px; align-items: start; }
    .side { padding: 18px 16px; font-size: 18px; }
    .side p { margin: 0 0 8px; font-weight: 500; }
    .side div { padding: 6px 10px; border-radius: 8px; color: var(--ink-2); }
    .side div.on { background: var(--tint); color: var(--ink); }
    .side p + div + p, .side .gap { margin-top: 16px; }
    .panel { padding: 20px 22px; }
    .panel h3 { margin: 0 0 14px; font-size: 19px; font-weight: 600; }
    .mx-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .mx-wrap { display: grid; justify-items: center; gap: 8px; }
    .select { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border: 1px solid #D5D9E1; border-radius: 10px; color: var(--ink-2); font-size: 16px; max-width: 280px; }
    .select span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mx { display: grid; grid-template-columns: 38px 70px repeat(3, 88px); align-items: center; font-size: 15px; color: var(--ink-3); }
    .mx .pred { grid-column: 3 / -1; text-align: center; color: var(--ink); font-size: 16px; font-weight: 500; }
    .mx .act { grid-row: 3 / span 3; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; color: var(--ink); font-size: 16px; font-weight: 500; }
    .mx .cl { text-align: center; padding-bottom: 6px; } .mx .rl { text-align: right; padding-right: 12px; }
    .mx .c { height: 74px; display: grid; place-items: center; border: 1px solid var(--line); margin: -1px 0 0 -1px; font-size: 17px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
    .prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .prompts > div { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; font-size: 17px; }
    .prompts b { display: block; font-weight: 500; margin-bottom: 8px; }
    .prompts p { margin: 0; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; font-size: 15.5px; line-height: 1.5; }

    /* ---------- Results ---------- */
    .res { display: grid; grid-template-columns: 210px 1fr; gap: 26px; padding: 22px 24px; }
    .res-top { display: grid; grid-template-columns: 1fr 470px; gap: 28px; align-items: start; }
    .def h3 { margin: 0 0 6px; font-size: 19px; font-weight: 600; }
    .def p { margin: 0 0 14px; color: var(--ink-3); font-size: 17.5px; }
    .res .mx .c { height: 60px; }
    .ring { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums;
      background: radial-gradient(closest-side, #fff 82%, transparent 83%), conic-gradient(var(--blue) calc(var(--p) * 1%), #E3E9F5 0); }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .mc { text-align: left; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 12px 14px; }
    .mc span { display: block; font-size: 14.5px; color: var(--ink-3); }
    .mc b { font-size: 21px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .mc.on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
    .seg { display: inline-flex; padding: 4px; border-radius: 10px; background: var(--tint); font-size: 16px; }
    .seg button { border: 0; background: none; padding: 6px 10px; border-radius: 7px; color: var(--ink-3); }
    .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .mx-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--ink-3); font-size: 16.5px; }
    .tick { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 18px; }
    .tick .box { width: 20px; height: 20px; }
    .tick.in { padding-left: 22px; }

    /* ---------- Click hints: a pulsing purple dot on the next thing to try, as in the Mensio prototype ---------- */
    [data-hint] { position: relative; }
    [data-hint]::after { content: ""; position: absolute; right: -7px; top: -7px; width: 16px; height: 16px; border-radius: 50%; pointer-events: none; z-index: 5;
      background: #8F7CD6; box-shadow: 0 0 0 0 rgba(143, 124, 214, .6); animation: hint 1.6s ease-out infinite; }
    .box[data-hint]::after { right: auto; top: 50%; left: 50%; translate: -50% -50%; }
    .open[data-hint]::after { top: 50%; right: -28px; translate: 0 -50%; }
    /* The hero loop is for watching, not clicking: no hints there */
    .tour [data-hint]::after, .tour-hints-off [data-hint]::after { display: none; }
    @keyframes hint { to { box-shadow: 0 0 0 18px rgba(143, 124, 214, 0); } }
    @media (prefers-reduced-motion: reduce) { [data-hint]::after { animation: none; } }
    /* Compare needs exactly two finished evaluations */
    .err { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 12px 16px; border-radius: 10px; background: #FDECEC; border: 1px solid #F5C2C2; color: #B42318; font-size: 17px; }
    .err b { font-weight: 600; }
    .grid.flag td:first-child { box-shadow: inset 3px 0 0 #E5484D; }
    .box:disabled { background: #F1F3F6; border-color: #D5D9E1; cursor: not-allowed; }

    /* ---------- Prompt ---------- */
    .ptab { overflow: hidden; }
    .ptab th { text-align: left; font-weight: 500; font-size: 17px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--tint); }
    .ptab td { padding: 18px 20px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 18px; }
    .ptab tr:last-child td { border-bottom: 0; }
    .ptab td:first-child, .ptab th:first-child { width: 200px; color: var(--ink-2); }
    .ptab pre { margin: 0 0 8px; padding: 14px 16px; border-radius: 10px; background: var(--tint); border: 1px solid var(--line); font: 16px/1.55 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: var(--ink); }
    .tok { color: var(--blue); background: var(--blue-soft); border-radius: 4px; padding: 0 3px; }
    .prompts p { white-space: pre-wrap; }

    /* ---------- Info ---------- */
    .info { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
    .info .col { display: grid; gap: 14px; }
    .info .card { padding: 14px 20px; }
    .info h3 { margin: 0 0 10px; font-size: 18.5px; font-weight: 600; }
    .kv { display: flex; justify-content: space-between; padding: 3px 0; font-size: 17px; }
    .kv span { color: var(--ink-3); } .kv b { font-weight: 400; font-variant-numeric: tabular-nums; }
    .bar { height: 10px; border-radius: 5px; background: var(--blue); margin: 6px 0 8px; }
    .link { color: var(--blue); }

    /* ---------- Before: the old Hive Compare Models page ---------- */
    .old { font-family: Roboto, Inter, sans-serif; background: #F7F8FA; }
    .old .top { background: #fff; border-color: #ECEDF0; }
    .hive { display: flex; align-items: center; gap: 12px; font-size: 27px; letter-spacing: .02em; }
    .hive b { font-weight: 500; letter-spacing: .12em; } .hive i { font-style: normal; }
    .bars { display: flex; gap: 4px; align-items: center; } .bars s { width: 6px; border-radius: 3px; background: #2D6BE4; }
    .old .page { padding: 22px 40px; }
    .old h1 { font-weight: 500; font-size: 29px; }
    .old .btn.primary { background: #2D6BE4; border-color: #2D6BE4; border-radius: 6px; }
    .old .side, .old .panel { background: #fff; border: 0; border-radius: 8px; box-shadow: 0 1px 3px rgba(20,30,60,.06); }
    .old .side div.on { background: #EDF2FD; color: #2D6BE4; }
    .lb { display: grid; grid-template-columns: 236px 40px repeat(6, 1fr) 22px; align-items: center; }
    .old .split { grid-template-columns: 160px 1fr; }
    .lb.hd { color: #6B7280; font-size: 16px; padding: 0 16px 10px; }
    .lb.row { padding: 14px 16px; margin-top: 8px; border-radius: 6px; background: #FAFBFC; font-size: 17px; color: #374151; }
    .lb.row.first { background: #F4F7FE; box-shadow: inset 0 0 0 1.5px #A9C2F5, inset 4px 0 0 #2D6BE4; }
    .lb .nm { font-weight: 500; color: #1F2937; display: flex; align-items: center; gap: 12px; }
    .lb .nm i { width: 13px; height: 13px; border-radius: 50%; flex: none; }
    .lb .v { color: #6B7280; }
    .lb.first .m { color: #2D6BE4; font-weight: 500; }
    .best { margin-left: 5px; padding: 1px 5px; border-radius: 4px; background: #3A3D45; color: #fff; font-size: 12.5px; font-weight: 400; vertical-align: 1px; }
    .chev { color: #2D6BE4; font-size: 15px; }
    .star { color: #2D6BE4; font-size: 18px; }
    .vs { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; font-size: 18px; color: #1F2937; }
    .sw { width: 46px; height: 24px; border-radius: 3px; }
    .sw.a { background: repeating-linear-gradient(135deg, #2D6BE4 0 4px, #8FB0F2 4px 8px); }
    .sw.b { background: radial-gradient(#fff 22%, transparent 25%) 0 0 / 8px 8px, #E04AD5; }
    .oldtabs { display: flex; gap: 28px; margin-top: 18px; padding-bottom: 8px; border-bottom: 1px solid #ECEDF0; font-size: 18px; color: #6B7280; }
    .oldtabs b { color: #2D6BE4; font-weight: 500; box-shadow: 0 10px 0 -8px #2D6BE4; }
    /* Old overlaid confusion matrix: both models share one grid, one number in each corner */
    .omx-panel { padding: 26px 30px 34px; }
    .omx-desc { margin: 16px 0 14px; font-size: 18px; color: #374151; }
    .omx-norm { display: flex; justify-content: flex-end; }
    .omx-norm span { padding: 8px 14px; font-size: 17px; color: #9CA3AF; background: #F3F4F6; }
    .omx-norm span.on { color: #2D6BE4; background: #fff; box-shadow: inset 0 0 0 1px #F3F4F6; }
    .omx-pick { display: grid; grid-template-columns: 1fr auto 1fr; justify-items: center; align-items: center; gap: 4px 26px; margin: 10px auto 0; width: 760px; font-size: 21px; color: #1F2937; }
    .omx-pick .l { justify-self: end; display: flex; align-items: center; gap: 14px; } .omx-pick .r { justify-self: start; display: flex; align-items: center; gap: 14px; }
    .omx-pick small { font-size: 19px; color: #4B5563; }
    .omx-pick small.l { justify-self: end; margin-right: 26px; } .omx-pick small.r { justify-self: start; margin-left: 26px; }
    .sw.p { background: repeating-linear-gradient(135deg, #E5487A 0 4px, #F49AB7 4px 8px); }
    .sw.y { background: radial-gradient(#fff 20%, transparent 24%) 0 0 / 8px 8px, #D7EE4A; }
    .omx { display: grid; grid-template-columns: 40px 110px 230px 230px; grid-template-rows: auto auto 230px 230px; gap: 22px; justify-content: center; align-items: center; margin-top: 14px; color: #4B5563; font-size: 19px; }
    .omx .pr { grid-column: 3 / 5; text-align: center; color: #1F2937; font-weight: 500; font-size: 21px; }
    .omx .ac { grid-row: 3 / 5; grid-column: 1; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; color: #1F2937; font-weight: 500; font-size: 21px; }
    .omx .rl { text-align: right; } .omx .cl { text-align: center; }
    .omx .cell { position: relative; width: 230px; height: 230px; }
    .omx .cell::after { content: ""; position: absolute; inset: 0; background: radial-gradient(rgba(255,255,255,.35) 18%, transparent 22%) 0 0 / 10px 10px; }
    .omx .a, .omx .b { position: absolute; z-index: 1; font-weight: 500; }
    .omx .a { left: 18px; top: 16px; font-size: 21px; } .omx .b { right: 18px; bottom: 14px; font-size: 34px; }
    /* Numbered pins for the case study's notes; hidden in the hero loop */
    .pin { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: #7058CB; color: #fff; display: grid; place-items: center; font: 600 19px Inter, sans-serif;
      box-shadow: 0 0 0 5px rgba(143, 124, 214, .25); z-index: 3; }
    .rel { position: relative; }
    .tour .pin, .nopins .pin { display: none; }
    .ring-hi { left: 284px; right: 40px; top: 4px; bottom: 4px; }
    .focus .ring-hi { left: 360px; right: 44px; }
    /* The hero window is narrower, so the name column gives the scores more room */
    .tour .lb { grid-template-columns: 250px 38px repeat(6, 1fr) 20px; }
    .tour .lb.row { font-size: 20px; }
    .tour .ring-hi { left: 304px; right: 34px; }
    .note { left: 520px; top: 96px; }
    .ring-hi { position: absolute; border: 4px solid #8F7CD6; border-radius: 12px; pointer-events: none; opacity: 0; transform: scale(1.04); transition: opacity .4s ease .5s, transform .4s ease .5s; }
    .note { position: absolute; margin: 0; padding: 20px 26px; border-radius: 18px; background: #F3F0FB; color: #2E2357; font: 600 32px/1.25 Inter, sans-serif; z-index: 4; white-space: nowrap;
      box-shadow: 0 16px 40px -12px rgba(67, 20, 7, .45); transform: rotate(-3deg) translateY(16px); opacity: 0; transition: opacity .4s ease 1.1s, transform .5s cubic-bezier(.3, 0, .2, 1) 1.1s; }
    .note small { display: block; margin-top: 6px; font: 400 22px/1.3 Inter, sans-serif; color: #7058CB; }
    .tour #v-before:not(.out) .ring-hi { opacity: 1; transform: none; }
    .tour #v-before:not(.out) .note { opacity: 1; transform: rotate(-3deg); }
    /* Case study figure: just the leaderboard, larger, so the problems read at column width */
    .focus .old .top, .focus .old .rail, .focus .old .side, .focus .old .crumb, .focus .old .head { display: none; }
    .focus .old .body { height: 100%; } .focus .old .page { padding: 28px 52px 28px 28px; }
    .focus .old .split { display: block; } .focus .old .panel { padding: 26px 30px; }
    .focus .lb { grid-template-columns: 300px 46px repeat(6, 1fr) 26px; }
    .focus .lb.hd { font-size: 20px; } .focus .lb.row { font-size: 21px; padding: 17px 18px; }
    .focus .best { font-size: 15px; } .focus .old h3 { font-size: 24px !important; }
    .focus .oldtabs, .focus .vs { font-size: 21px; } .focus .pin { width: 46px; height: 46px; font-size: 23px; }
    /* Hero loop: the app sits in a window on the project's orange gradient */
    body.tour { background: linear-gradient(135deg, #1f2430, #6b7591); }
    .tour #app { position: absolute; left: 64px; right: 64px; top: 48px; bottom: 0; overflow: hidden; border-radius: 14px 14px 0 0; box-shadow: 0 16px 60px rgba(10, 14, 24, .45); }
    body:not(.tour) .ring-hi, body:not(.tour) .note { display: none; }
    @media (prefers-reduced-motion: reduce) { .view, .ring-hi, .note { transition: none; } }
  </style>
</head>
<body>

    const SCHEMA = '{\n  "type": "object",\n  "properties": {\n    "label": { "type": "string", "enum": ["cat", "dog", "rabbit"] }\n  },\n  "required": ["label"]\n}';
    const code = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\{image\}/g, '<span class="tok">{image}</span>');
    const EVALS = [
      { name: "Pets · first prompt", id: "3f9a21c4-7d0e-4b8a-9c1f-52e8d0a7b613", ver: "v1", date: "09/14/2026", raw: [[33, 4, 3], [5, 31, 4], [3, 4, 33]], prompt: PROMPT_1, color: "#1F6BFF" },
      { name: "Pets · clearer prompt", id: "a0c47e19-25b3-4f6d-8e2a-0b9d31f4c77e", ver: "v2", date: "09/21/2026", raw: [[38, 1, 1], [2, 37, 1], [1, 1, 38]], prompt: PROMPT_2, color: "#93B4FF" },
      { name: "Pets · smaller model", id: "c81e5b02-9f4a-4d17-b3c6-e27a0d58f9b1", ver: "v1", date: "09/22/2026", raw: [[30, 6, 4], [7, 28, 5], [5, 6, 29]], prompt: PROMPT_2, color: "#7C5CFF" },
      { name: "Pets · bigger snapshot", id: "e4d29a7f-0b13-4c85-a6e9-71f3c2b8d045", ver: "v3", date: "09/23/2026", raw: null, prompt: PROMPT_2, color: "#00A3A3" },
    ];
    // Macro-averaged metrics from a confusion matrix (rows: actual, columns: predicted)
    function metrics(raw) {
      const n = raw.length, total = raw.flat().reduce((a, b) => a + b, 0);
      const m = { ba: 0, prec: 0, rec: 0, f1: 0, fpr: 0, spec: 0 };
      for (let k = 0; k < n; k++) {
        const tp = raw[k][k], fn = raw[k].reduce((a, b) => a + b, 0) - tp, fp = raw.reduce((a, r) => a + r[k], 0) - tp, tn = total - tp - fn - fp;
        const rec = tp / (tp + fn), spec = tn / (tn + fp), prec = tp / (tp + fp);
        m.rec += rec; m.spec += spec; m.prec += prec; m.f1 += 2 * prec * rec / (prec + rec); m.fpr += fp / (fp + tn); m.ba += (rec + spec) / 2;
      }
      for (const key in m) m[key] /= n;
      return m;
    }
    EVALS.forEach((e) => { if (e.raw) e.m = metrics(e.raw); });
    const pct = (x) => (x * 100).toFixed(2) + "%";
    const METRICS = [

      ["prec", "Precision", "Of the images the model gave a class, the share it got right, averaged across classes. Higher is better."],
      ["rec", "Recall", "Of the images that truly belong to a class, the share the model found, averaged across classes. Higher is better."],

    const logo = `<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" width="246" height="34" role="img" aria-label="Deploy AutoML" fill="none" viewBox="0 0 202 28"><g fill="#2457ff"><path d="M18.366 2.317H8.3l2.942 3.368h4.817l5.597 8.392h.012l-5.594 8.387h-4.812l-2.946 3.373h10.062l7.837-11.751-7.849-11.769z"></path><path fill-rule="evenodd" d="M6.65 2.317H1.787v4.858l6.028 6.902h.016l-6.044 6.92v4.834l.007.006h4.872l10.263-11.751L6.65 2.317z"></path></g><path d="M32.48 23.04V5.679h6.2c1.835 0 3.39.38 4.663 1.141a7.33 7.33 0 0 1 2.902 3.075c.661 1.29.992 2.77.992 4.44 0 1.687-.331 3.183-.992 4.489s-1.629 2.34-2.902 3.1c-1.273.744-2.827 1.116-4.663 1.116h-6.2zm3.175-2.778h3.026c1.224 0 2.216-.273 2.976-.818.777-.546 1.348-1.265 1.711-2.158.38-.893.57-1.877.57-2.951 0-1.058-.19-2.034-.57-2.927-.364-.893-.934-1.604-1.711-2.133-.761-.546-1.753-.818-2.976-.818h-3.026v11.806zm19.668 3.175c-1.438 0-2.687-.306-3.745-.918-1.058-.628-1.885-1.496-2.48-2.604-.579-1.108-.868-2.373-.868-3.795 0-1.439.289-2.712.868-3.82.595-1.108 1.422-1.976 2.48-2.604s2.307-.942 3.745-.942c.943 0 1.827.19 2.654.57a5.85 5.85 0 0 1 2.183 1.637c.612.711 1.058 1.587 1.339 2.629s.331 2.224.149 3.547H50.016v-2.555h9.697l-1.141.719a3.63 3.63 0 0 0-.248-1.786 3.02 3.02 0 0 0-1.066-1.414c-.496-.364-1.141-.546-1.935-.546-.893 0-1.629.207-2.207.62-.579.397-1.009.942-1.29 1.637-.265.678-.397 1.447-.397 2.307 0 .843.132 1.612.397 2.307.281.678.711 1.215 1.29 1.612s1.314.595 2.207.595c.827 0 1.496-.19 2.009-.57.513-.397.868-.876 1.066-1.439h3.274c-.198.959-.587 1.802-1.166 2.53a6.15 6.15 0 0 1-2.183 1.686c-.876.397-1.877.595-3.001.595zm15.325 0c-1.025 0-1.885-.198-2.579-.595s-1.24-.934-1.637-1.612V11.011a4.64 4.64 0 0 1 1.686-1.662c.695-.397 1.538-.595 2.53-.595 1.306 0 2.422.314 3.348.942s1.637 1.496 2.133 2.604c.513 1.108.769 2.381.769 3.82 0 1.422-.256 2.687-.769 3.795-.496 1.108-1.207 1.976-2.133 2.604-.926.612-2.042.918-3.348.918zM63.307 28V9.151h3.125V28h-3.125zm6.845-7.366c.761 0 1.405-.19 1.935-.57.529-.397.926-.934 1.191-1.612.281-.694.422-1.472.422-2.331 0-.876-.141-1.662-.422-2.356-.264-.694-.661-1.232-1.19-1.612-.529-.397-1.174-.595-1.934-.595-.843 0-1.538.207-2.083.62-.546.397-.959.942-1.24 1.637-.264.678-.397 1.447-.397 2.307 0 .843.132 1.612.397 2.307.281.678.695 1.215 1.24 1.612s1.24.595 2.083.595zm8.242-16.196h3.125V23.04h-3.125V4.438zM90.05 23.437c-1.439 0-2.687-.306-3.745-.918-1.058-.628-1.885-1.496-2.48-2.604-.579-1.108-.868-2.373-.868-3.795 0-1.439.289-2.712.868-3.82.595-1.108 1.422-1.976 2.48-2.604s2.307-.942 3.745-.942 2.687.314 3.745.942 1.877 1.496 2.455 2.604c.595 1.108.893 2.381.893 3.82 0 1.422-.298 2.687-.893 3.795-.579 1.108-1.397 1.976-2.455 2.604-1.058.612-2.307.918-3.745.918zm.025-2.803c.843 0 1.554-.19 2.133-.57a3.72 3.72 0 0 0 1.314-1.612c.298-.694.446-1.472.446-2.331 0-.876-.149-1.662-.446-2.356s-.736-1.232-1.314-1.612c-.579-.397-1.29-.595-2.133-.595-.86 0-1.579.198-2.158.595-.579.38-1.017.918-1.315 1.612s-.447 1.48-.447 2.356c0 .86.149 1.637.447 2.331.298.678.736 1.215 1.315 1.612.579.38 1.298.57 2.158.57zM111.132 9.04h-3.829l-3.407 9.412-3.073-9.412h-3.782l5.119 13.889-.942 2.307h-3.225v2.654h5.481l7.657-18.849z" fill="#1a1a1a"></path><g fill="#1A1A1A"><path d="M122.49 5.79H125.05L119.74 23H116.93L122.49 5.79ZM126.15 5.79L131.83 23H129.03L123.57 5.79H126.15ZM119.61 16.66H128.88V19.02H119.61V16.66Z"/><path d="M144.5 23H141.87V9.23H144.5V23ZM141.87 16.09L142.26 18.8C142.26 19.22 142.19 19.7 142.04 20.22C141.89 20.75 141.63 21.25 141.25 21.75C140.89 22.22 140.39 22.61 139.75 22.93C139.12 23.24 138.3 23.39 137.32 23.39C136.44 23.39 135.64 23.21 134.94 22.85C134.25 22.49 133.7 21.89 133.29 21.06C132.9 20.22 132.7 19.11 132.7 17.71V9.23H135.33V17.39C135.33 18.15 135.4 18.8 135.55 19.36C135.7 19.9 135.96 20.33 136.34 20.64C136.73 20.93 137.28 21.08 137.98 21.08C138.66 21.08 139.29 20.89 139.88 20.52C140.47 20.14 140.94 19.58 141.3 18.85C141.68 18.09 141.87 17.17 141.87 16.09Z"/><path d="M146.06 9.23H153.31V11.49H146.06V9.23ZM148.12 5.79H150.75V19.26C150.75 19.77 150.88 20.15 151.12 20.39C151.37 20.62 151.73 20.74 152.21 20.74H153.71V23H152.18C150.84 23 149.82 22.67 149.13 22.02C148.46 21.34 148.12 20.43 148.12 19.26V5.79Z"/><path d="M161.38 23.39C159.95 23.39 158.71 23.09 157.66 22.48C156.62 21.86 155.8 21 155.21 19.9C154.63 18.8 154.34 17.55 154.34 16.14C154.34 14.71 154.63 13.45 155.21 12.35C155.8 11.26 156.62 10.4 157.66 9.77C158.71 9.15 159.95 8.84 161.38 8.84C162.8 8.84 164.04 9.15 165.09 9.77C166.14 10.4 166.95 11.26 167.52 12.35C168.11 13.45 168.41 14.71 168.41 16.14C168.41 17.55 168.11 18.8 167.52 19.9C166.95 21 166.14 21.86 165.09 22.48C164.04 23.09 162.8 23.39 161.38 23.39ZM161.38 20.98C162.28 20.98 163.05 20.79 163.69 20.39C164.33 19.98 164.82 19.42 165.16 18.7C165.51 17.96 165.68 17.11 165.68 16.14C165.68 15.16 165.51 14.3 165.16 13.56C164.82 12.82 164.33 12.26 163.69 11.86C163.05 11.45 162.28 11.25 161.38 11.25C160.47 11.25 159.7 11.45 159.04 11.86C158.4 12.26 157.91 12.82 157.57 13.56C157.22 14.3 157.05 15.16 157.05 16.14C157.05 17.11 157.22 17.96 157.57 18.7C157.91 19.42 158.4 19.98 159.04 20.39C159.7 20.79 160.47 20.98 161.38 20.98Z"/><path d="M176.75 23L171.66 5.79H174.44L179.3 23H176.75ZM180.53 23H177.95L182.84 5.79H185.6L180.53 23ZM170.18 5.79H172.74V23H170.18V5.79ZM184.52 5.79H187.1V23H184.52V5.79Z"/><path d="M189.56 5.79H192.24V23H189.56V5.79ZM191.67 20.64H199.88V23H191.67V20.64Z"/></g></svg></div>`;
    // Side nav from the Deploy AutoML Figma file: Lucide icons, with the current section in blue
    const NAV = {"server": "<rect width=\"20\" height=\"8\" x=\"2\" y=\"2\" rx=\"2\" ry=\"2\" /> <rect width=\"20\" height=\"8\" x=\"2\" y=\"14\" rx=\"2\" ry=\"2\" /> <line x1=\"6\" x2=\"6.01\" y1=\"6\" y2=\"6\" /> <line x1=\"6\" x2=\"6.01\" y1=\"18\" y2=\"18\" />", "git-compare": "<circle cx=\"18\" cy=\"18\" r=\"3\" /> <circle cx=\"6\" cy=\"6\" r=\"3\" /> <path d=\"M13 6h3a2 2 0 0 1 2 2v7\" /> <path d=\"M11 18H8a2 2 0 0 1-2-2V9\" />", "clipboard-check": "<rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\" /> <path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\" /> <path d=\"m9 14 2 2 4-4\" />", "house": "<path d=\"M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8\" /> <path d=\"M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\" />", "lightbulb": "<path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\" /> <path d=\"M9 18h6\" /> <path d=\"M10 22h4\" />", "circle-dollar-sign": "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8\" /> <path d=\"M12 18V6\" />", "message-square-quote": "<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\" /> <path d=\"M8 12a2 2 0 0 0 2-2V8H8\" /> <path d=\"M14 12a2 2 0 0 0 2-2V8h-2\" />", "file-text": "<path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\" /> <path d=\"M14 2v4a2 2 0 0 0 2 2h4\" /> <path d=\"M10 9H8\" /> <path d=\"M16 13H8\" /> <path d=\"M16 17H8\" />", "message-square-warning": "<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\" /> <path d=\"M12 7v2\" /> <path d=\"M12 13h.01\" />"};
    const navIcon = (n, on) => `<span class="nav-i${on ? " on" : ""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${NAV[n]}</svg></span>`;
    const sideNav = `<nav class="rail">${["server", "git-compare", "clipboard-check"].map((n) => navIcon(n, n === "clipboard-check")).join("")}<hr><span class="sp"></span><hr>${["house", "lightbulb", "circle-dollar-sign", "message-square-quote", "file-text", "message-square-warning"].map((n) => navIcon(n)).join("")}</nav>`;
    const chrome = (inner, rail = 2) => `<div class="top">${logo}<span class="sp"></span><span class="chip">Pricing</span><span class="chip">$0.05</span><span class="chip">San Francisco ${I.chev}</span>
      <div class="who"><span class="av">JL</span><div><b>Personal Organization</b><br><span>Jordan Lee</span></div></div></div>
      <div class="body">${sideNav}<div class="page">${inner}</div></div>`;

    // ---------- Views ----------
    const state = { picked: [], err: "", cmpTab: "matrix", res: 1, metric: "ba", norm: "actual" };

    function list() {
      const n = state.picked.length;
      const rows = EVALS.map((e, i) => `<tr class="${state.picked.includes(i) ? "sel" : ""}">
        <td style="width:56px;text-align:center"><button class="box lead ${state.picked.includes(i) ? "on" : ""}" ${n < 2 && e.raw && !state.picked.includes(i) && i === EVALS.findIndex((x, k) => x.raw && !state.picked.includes(k)) ? `data-hint="${n ? "Tick one more" : "Tick two"}"` : ""} data-pick="${i}" aria-label="Select ${e.name}" ${e.raw ? "" : 'disabled title="Still running: it can be compared once it finishes"'}></button></td>
        <td>${e.raw ? `<button class="open" data-open="${i}">${e.name}</button>` : e.name}<span class="id">${e.id}</span></td><td>${e.ver.slice(1)}</td><td class="num">${e.date}</td><td>Vision Language Model</td>
        <td>${e.raw ? '<span class="pill ok">Completed</span>' : '<span class="pill run">Running</span>'}</td>
        <td class="num">${e.raw ? pct(e.m.ba) : '<span class="muted">—</span>'}</td></tr>`).join("");
      return chrome(`<div class="head"><h1>Evaluations</h1><span class="sp"></span><button class="btn below" data-compare ${n === 2 ? 'data-hint="Click to compare"' : ""}>Compare Evaluations</button><button class="btn primary">Create New Evaluation</button></div>
        <div class="tools"><span class="muted">${I.sliders}</span><div class="search">${I.search}Search by name or ID</div><span class="toggle">Show examples <i></i></span></div>
        ${state.err ? `<div class="err" role="alert"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>${state.err}</div>` : ""}<div class="grid ${state.err ? "flag" : ""}"><table><thead><tr><th></th><th>Name / ID</th><th>Version</th><th>Date created</th><th>Evaluation model type</th><th>Status</th><th>Balanced accuracy</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="foot"><span>Showing 1–4 of 4</span><span class="hint">${n === 2 ? "2 selected · ready to compare" : `${n} of 2 selected`}</span></div>`);
    }

    function matrix(e, norm = "actual") {
      const raw = e.raw, colSum = CLASSES.map((_, k) => raw.reduce((a, r) => a + r[k], 0));
      const val = (r, c) => norm === "raw" ? raw[r][c] : norm === "actual" ? raw[r][c] / raw[r].reduce((a, b) => a + b, 0) : raw[r][c] / colSum[c];
      let cells = `<span></span><span></span><span class="pred">Predicted</span><span></span><span></span>${CLASSES.map((c) => `<span class="cl">${c}</span>`).join("")}<span class="act">Actual</span>`;
      CLASSES.forEach((rc, r) => {
        cells += `<span class="rl">${rc}</span>`;
        CLASSES.forEach((_, c) => {
          const v = val(r, c), share = norm === "raw" ? v / 40 : v;
          const bg = `rgba(31,107,255,${(share * .95).toFixed(3)})`;
          cells += `<span class="c" style="background:${bg};color:${share > .5 ? "#fff" : "var(--ink)"}">${norm === "raw" ? v : Math.round(v * 100) + "%"}</span>`;
        });
      });
      return `<div class="mx">${cells}</div>`;
    }

    function compare() {
      // Opened from the tabs before two are picked: show the first two runs
      if (state.picked.length < 2) state.picked = [0, 1];
      const [a, b] = state.picked.map((i) => EVALS[i]);
      const cols = [["ba", "Balanced accuracy"], ["prec", "Precision"], ["rec", "Recall"], ["f1", "F1 score"], ["fpr", "FPR"]];
      const rows = [a, b].map((e, i) => `<tr class="${i === 0 ? "sel" : ""}"><td><span class="dot" style="background:${e.color}"></span><button class="open" ${i === 1 ? 'data-hint="Open its results"' : ""} data-open="${state.picked[i]}">${e.name}</button></td><td>${e.ver}</td>${cols.map(([k]) => `<td class="num">${pct(e.m[k])}</td>`).join("")}</tr>`).join("");
      const body = state.cmpTab === "matrix"
        ? `<div class="mx-pair">${[a, b].map((e) => `<div class="mx-wrap"><span class="select"><span class="dot" style="background:${e.color};margin-right:2px"></span><span>${e.name}</span>${I.chev}</span>${matrix(e)}</div>`).join("")}</div>`
        : `<div class="prompts">${[a, b].map((e) => `<div><b><span class="dot" style="background:${e.color}"></span>${e.name}</b><p>${code(e.prompt)}</p></div>`).join("")}</div>`;
      return chrome(`<div class="crumb"><span data-go="list" style="cursor:pointer">Evaluations</span> › <b>Compare Evaluations</b></div>
        <div class="head"><h1>Compare Evaluations</h1><span class="sp"></span><button class="btn icon" aria-label="Copy link">${I.link}</button><button class="btn primary" data-go="list">${I.plus}Select Evaluations</button></div>
        <div class="split"><div class="side card"><p>Label</p><div class="on">label</div><p class="gap">Class</p>${CLASSES.map((c) => `<div>${c}</div>`).join("")}</div>
        <div class="panel card"><h3>Evaluation metrics</h3>
          <div class="grid" style="margin-bottom:18px"><table><thead><tr><th>Evaluation</th><th>Version</th>${cols.map(([, l]) => `<th>${l}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
          <div class="tabs"><button class="${state.cmpTab === "matrix" ? "on" : ""}" data-cmp="matrix">Confusion matrix</button><button class="${state.cmpTab === "prompts" ? "on" : ""}" data-cmp="prompts">Prompts</button></div>
          ${body}</div></div>`);
    }

    function evalHead(e, tab) {
      return `<div class="crumb">Evaluations › <b>${e.name}</b></div>
        <div class="head" style="align-items:flex-start"><div><div style="display:flex;align-items:center;gap:14px"><h1>${e.name}</h1><span class="pill ok">Completed</span></div><div class="sub">Vision Language Model</div></div>
        <span class="sp"></span><button class="btn">Clone Evaluation</button><button class="btn" data-go="list">Compare Evaluations</button><button class="btn">Open Playground ${I.ext}</button><button class="btn primary">Use Model ${I.ext}</button></div>
        <div class="tabs"><button class="${tab === "results" ? "on" : ""}" data-go="results">Results</button><button class="${tab === "prompt" ? "on" : "aside"}" ${tab === "results" ? 'data-hint="See the prompt"' : ""} data-go="prompt">Prompt</button><button class="${tab === "info" ? "on" : "aside"}" ${tab === "prompt" ? 'data-hint="See the settings"' : ""} data-go="info">Evaluation info</button></div>`;
    }

    function results() {
      const e = EVALS[state.res], [, label, def] = METRICS.find(([k]) => k === state.metric), v = e.m[state.metric];
      const norms = [["raw", "Raw counts"], ["actual", "Normalized by actual"], ["predicted", "Normalized by predicted"]];
      return chrome(evalHead(e, "results") + `<div class="card res">
        <div><p style="margin:0 0 10px;font-weight:500">Label / class</p><div class="tick"><span class="box on"></span>label</div>${CLASSES.map((c) => `<div class="tick in"><span class="box on"></span>${c}</div>`).join("")}</div>
        <div><div class="res-top"><div class="def"><h3>${label}</h3><p>${def}</p><div class="ring" style="--p:${(v * 100).toFixed(1)}">${(v * 100).toFixed(1)}%</div></div>
          <div class="cards">${METRICS.map(([k, l]) => `<button class="mc ${k === state.metric ? "on" : ""}" data-metric="${k}"><span>${l}</span><b>${pct(e.m[k])}</b></button>`).join("")}</div></div>
          <div class="tabs" style="margin-top:14px"><button class="on">Confusion matrix</button><button>Prompt results</button></div>
          <div class="mx-bar"><span>Compares actual labels with model predictions for each row.</span><div class="seg">${norms.map(([k, l]) => `<button class="${state.norm === k ? "on" : ""}" data-norm="${k}">${l}</button>`).join("")}</div></div>
          <div style="display:grid;justify-items:center">${matrix(e, state.norm)}</div></div></div>`, 2);
    }

    function prompt() {
      const e = EVALS[state.res];
      return chrome(evalHead(e, "prompt") + `<div class="card ptab"><table><thead><tr><th>Prompt</th><th>Value</th></tr></thead><tbody>
        <tr><td>Prompt</td><td><pre>${code(e.prompt)}</pre><span class="muted" style="font-size:15.5px">{image} embeds each snapshot image in the prompt.</span></td></tr>
        <tr><td>JSON schema</td><td><pre>${code(SCHEMA)}</pre></td></tr>
        <tr><td>Snapshot</td><td><span class="link">Pets · Sept</span> <span class="muted">· 120 rows, 40 per class</span></td></tr></tbody></table></div>`, 2);
    }

    function info() {
      const e = EVALS[state.res];
      const kv = (rows) => rows.map(([k, v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join("");
      return chrome(evalHead(e, "info") + `<div class="info"><div class="col">
          <div class="card" style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Evaluation status</h3><span class="pill ok">Completed</span></div>
          <div class="card"><h3>Evaluation options</h3>${kv([["Output format type", "JSON Schema"], ["Max tokens", "512"], ["Prompt scope", "Once"], ["Sampling strategy", "FPS"], ["FPS", "1"], ["Temperature", "0"], ["Top K", "1"], ["Top P", "0.95"], ["Region", "San Francisco"]])}</div>
          <div class="card"><h3>Estimated billing units</h3>${kv([["Total", "176,400"], ["Average per row", "1,470"]])}</div></div>
        <div class="col">
          <div class="card"><h3>Average inference latency</h3>${kv([["p50", "861 ms"], ["p90", "947 ms"], ["p99", "1,186 ms"]])}</div>
          <div class="card"><h3>Token count</h3>${kv([["Average prompt tokens", "1,463"], ["Average completion tokens", "7"]])}</div>
          <div class="card"><h3>Progress</h3><div class="bar"></div><span class="muted" style="font-size:16px">120 of 120 rows completed</span></div>
          <div class="card"><h3>Data</h3>${kv([["Snapshot", '<span class="link">Pet photos · Sept</span>'], ["Rows", "120 / 4.2 MiB"], ["Dataset", '<span class="link">Pet photos</span>']])}</div></div></div>`, 2);
    }

    function before() {
      const rows = [
        ["Hive Example Image Model", "v1", "#2D6BE4", ["100.00%", "100.00%", "0.00%", "100.00%", "100.00%", "100.00%"]],
        ["New Model", "v2", "#E04AD5", ["100.00%", "100.00%", "0.00%", "100.00%", "100.00%", "100.00%"]],
        ["New Model - vmr", "v4", "#E5484D", ["50.00%", "66.67%", "50.00%", "50.00%", "50.00%", "50.00%"]],
        ["Img FFT w/o Temp Scaling", "v6", "#F0642C", ["100.00%", "100.00%", "0.00%", "100.00%", "100.00%", "100.00%"]],
        ["Img LL Temp Scaling", "v5", "#F2B13A", ["100.00%", "100.00%", "0.00%", "100.00%", "100.00%", "100.00%"]],
        ["Img LL w/o Temp Scaling", "v4", "#D8E84A", ["100.00%", "100.00%", "0.00%", "100.00%", "100.00%", "100.00%"]],
      ];
      const lb = rows.map(([n, v, c, ms], i) => `<div class="lb row ${i ? "" : "first"} rel"><span class="nm"><i style="background:${c}"></i>${n}</span><span class="v">${v}</span>
        ${ms.map((m) => `<span class="m">${m}${i ? "" : '<span class="best">Best</span>'}</span>`).join("")}<span class="chev">⌄</span>
        ${i ? "" : '<span class="pin" style="right:-14px;top:-20px">1</span><span class="ring-hi"></span><p class="note">Best… at what?<small>Five rows score 100% on everything.</small></p>'}</div>`).join("");
      return `<div class="top"><div class="hive"><span class="bars"><s style="height:18px"></s><s style="height:28px"></s><s style="height:22px"></s></span><b>HIVE</b><i>AutoML</i></div><span class="sp"></span>
        <div class="who"><span class="av">AG</span><div><b>Auto-ML Staging Organization</b><br><span>Workspace</span></div></div></div>
        <div class="body"><div class="rail"><span></span><span class="on"></span><span></span><span></span></div><div class="page">
        <div class="crumb">Models › <b>Compare Models</b></div>
        <div class="head"><h1>Compare Models</h1><span class="sp"></span><button class="btn primary">+ Add Models</button></div>
        <div class="split"><div class="side card"><p>Label</p><div class="on">label</div><p class="gap">Class</p><div>cat</div><div>dog</div></div>
        <div class="panel card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Model Metrics</h3><span class="rel" style="color:#2D6BE4">${I.sliders}<span class="pin" style="left:-60px;top:30px">3</span></span></div>
          <div class="lb hd" style="margin-top:8px"><span></span><span></span><span class="rel">Balanced Accuracy <span class="star rel">★<span class="pin" style="left:-12px;top:-50px">2</span></span></span><span>F1 Score</span><span>False Positive Rate</span><span>Precision</span><span>Recall</span><span>Specificity</span><span></span></div>
          ${lb}
          <div class="oldtabs"><b>Confusion Matrix</b><span>PR Curve</span><span>ROC Curve</span></div>
          <div class="vs rel">Hive Example Image Model ${I.chev}<span class="sw a"></span><span class="muted">vs</span><span class="sw b"></span>New Model ${I.chev}<span class="pin" style="position:static;margin-left:4px">4</span></div>
        </div></div></div></div>`;
    }

    function beforeMatrix() {
      const cell = (bg, a, ac, b, bc) => `<div class="cell" style="background:${bg}"><span class="a" style="color:${ac}">${a}</span><span class="b" style="color:${bc}">${b}</span></div>`;
      return `<div class="body"><div class="page"><div class="panel card omx-panel">
        <div class="oldtabs" style="margin-top:0"><b>Confusion Matrix</b><span>PR Curve</span><span>ROC Curve</span></div>
        <p class="omx-desc">The confusion matrix is a table comparing actual labels against model predictions for each instance. It helps to visualize which classes the model predicts for each actual label.</p>
        <div class="omx-norm"><span>Raw Counts</span><span class="on">Normalized by Actual</span><span>Normalized by Predicted</span></div>
        <div class="omx-pick"><span class="l">New Model - vmr ${I.chev}<span class="sw p"></span></span><span class="muted">vs</span><span class="r"><span class="sw y"></span>Img LL w/o Temp Scaling ${I.chev}</span>
          <small class="l">0 / 4</small><span></span><small class="r">2 / 4</small></div>
        <div class="omx"><span></span><span></span><span class="pr">Predicted</span><span></span><span></span><span class="cl">Negative</span><span class="cl">Positive</span>
          <span class="ac">Actual</span>
          <span class="rl">Negative</span>${cell("#D3EE3F", "0%", "rgba(255,255,255,.75)", "100%", "#fff")}${cell("#EEF8B8", "100%", "#E5487A", "0%", "#D3EE3F")}
          <span class="rl">Positive</span>${cell("#F6F7F9", "0%", "#E5487A", "0%", "#E3F08F")}${cell("#A3A3A3", "100%", "#fff", "100%", "#fff")}
        </div></div></div></div>`;
    }

    const VIEWS = { list, compare, results, prompt, info, before, "before-matrix": beforeMatrix };
    const app = document.getElementById("app");
    let cur = null;
    function render() { const el = document.getElementById("v-" + cur); if (el) el.innerHTML = VIEWS[cur](); }
    function show(v) {
      if (!VIEWS[v]) return;
      let el = document.getElementById("v-" + v);
      if (!el) { el = document.createElement("div"); el.id = "v-" + v; el.className = "view out" + (v.startsWith("before") ? " old" : ""); app.appendChild(el); }
      el.innerHTML = VIEWS[v]();
      document.querySelectorAll(".view").forEach((x) => x.classList.toggle("out", x !== el));
      cur = v;
      if (parent !== window) parent.postMessage({ shown: v === "prompt" ? "results" : v }, "*");
    }
    app.addEventListener("click", (e) => {
      const t = e.target.closest("[data-pick],[data-go],[data-cmp],[data-metric],[data-norm],[data-open],[data-compare]");
      if (!t || document.body.classList.contains("tour")) return;
      if (t.dataset.pick) {
        const i = +t.dataset.pick, p = state.picked;
        if (p.includes(i)) { state.picked = p.filter((x) => x !== i); state.err = ""; }
        else if (p.length >= 2) state.err = "<span><b>You can compare two evaluations at a time.</b> Untick one to swap it out.</span>";
        else { state.picked = [...p, i]; state.err = ""; }
        render();
      } else if ("compare" in t.dataset) {
        const n = state.picked.length;
        if (n === 2) { state.err = ""; show("compare"); }
        else { state.err = `<span><b>Select two evaluations to compare.</b> ${n ? "You've selected one, so pick one more." : "Tick two completed evaluations in the list."}</span>`; render(); }
      } else if (t.dataset.open) { state.res = +t.dataset.open; show("results"); }
      else if (t.dataset.go) show(t.dataset.go);
      else {
        if (t.dataset.cmp) state.cmpTab = t.dataset.cmp;
        if (t.dataset.metric) state.metric = t.dataset.metric;
        if (t.dataset.norm) state.norm = t.dataset.norm;
        render();
      }
    });

    const qs = new URLSearchParams(location.search);
    if (qs.get("scroll")) document.body.classList.add("scroll");
    if (qs.get("focus")) document.body.classList.add("focus");
    if (qs.get("pins") === "0") document.body.classList.add("nopins");
    if (qs.get("nohint")) document.body.classList.add("tour-hints-off");
    const start = qs.get("v") || "list";
    if (start === "tour") {
      // Hero loop: the old leaderboard with its unexplained Best badges, then the shipped comparison
      document.body.classList.add("tour", "focus");
      show("compare"); show("before");
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        let after = false;
        setInterval(() => { after = !after; show(after ? "compare" : "before"); }, 3800);
      }
    } else show(start);
    addEventListener("message", (e) => { if (e.data && e.data.v && VIEWS[e.data.v]) show(e.data.v); });
  </script>
</body>
</html>
