<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Paper Card</title>
<!-- One project card as a simple modern newspaper page: the project's name over a rule, a headline, one line
     under it and the hero in a big photo box. Type and colour come from the site's styles.css, so the cards
     follow the design system. ?p=0..3 picks the project, ?shape=tall the Bulge/Drum card, ?shape=phone the grid card on a phone. -->
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<style>
  /* (classes are prefixed nc- so they never meet the site's own, e.g. .meta) */
  * { margin: 0; padding: 0; }
  html, body { height: auto; background: transparent; }
  .page { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; /* a soft gradient of the project's colours: its light colour top right, its tint, a hint of its dark colour bottom left */
    background: radial-gradient(140% 120% at 90% 0%, color-mix(in srgb, var(--c2) 48%, var(--tint)), var(--tint) 55%, color-mix(in srgb, var(--c1) 16%, var(--tint))); color: var(--ink-100); font-family: var(--font-sans); }
  .wide { width: 540px; height: 460px; padding: 18px 22px 16px; }
  .tall { width: 420px; height: 467px; padding: 16px 18px 14px; }
  /* phones: the grid card at its real size there (same shape as wide), so the type is read at its own size */
  .phone { width: 358px; height: 305px; padding: 14px 16px 12px; }
  .phone h1 { margin-top: 10px; font-size: 20px; }
  .phone .nc-deck { font-size: 12.5px; line-height: 1.4; }
  .phone :is(.nc-name, .nc-status, .nc-more) { font-size: 11px; }
  /* the faintest paper grain */
  .page::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; mix-blend-mode: multiply; opacity: .16;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .38  0 0 0 0 .34  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  /* labels: the site's small caps label (as .xp-label), the project name in its card colour */
  .nc-name, .nc-status, .nc-more { font: 500 12px/1 var(--font-sans); letter-spacing: .08em; text-transform: uppercase; }
  .nc-name { color: var(--accent); }
  .nc-status, .nc-more { color: var(--ink-55); }
  .nc-top { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  /* headline: .project-title, sized for the card */
  h1 { margin-top: 14px; font-family: var(--font-serif); font-weight: 400; font-size: 25px; line-height: 1.15; letter-spacing: -0.02em; color: var(--ink-100); }
  .tall h1 { font-size: 22px; }
  /* the line under it: running copy, muted */
  .nc-deck { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--ink-55); }
  /* the hero's opening frame; on the cloth its recording plays here (preview.js reads where this box is) */
  /* The hero's frame: always exactly 16:9 like the recording, as big as the space allows, so nothing is cut off */
  .nc-photo { margin-top: 12px; flex: 1; min-height: 0; display: grid; place-items: center; }
  .nc-frame { overflow: hidden; border-radius: 10px; background: var(--border); box-shadow: 0 0 0 1px var(--border); }
  .nc-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nc-more { margin-top: 10px; display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<div class="page" id="card"></div>
<script src="stories.js"></script>
<script>
const q = new URLSearchParams(location.search), s = STORIES[+q.get("p") || 0], tall = q.get("shape") === "tall", shape = ["tall", "phone"].includes(q.get("shape")) ? q.get("shape") : "wide";
const card = document.getElementById("card");
card.className = "page " + shape;
card.style.setProperty("--accent", s.accent);
card.style.setProperty("--tint", s.tint);
card.style.setProperty("--c2", s.c[1]);
card.style.setProperty("--c1", s.c[0]);   // a very faint wash of the project's colour
card.innerHTML = `
  <div class="nc-top"><div class="nc-name">${s.title}</div><div class="nc-status">${s.status} ${s.year}</div></div>
  <h1>${s.head}</h1>
  <p class="nc-deck">${s.deck}</p>
  <div class="nc-photo"><div class="nc-frame"><img src="${q.get("photo") || s.photo}" alt=""></div></div>
  <div class="nc-more"><span>Read the story &rarr;</span></div>`;
// fit a 16:9 frame inside whatever room the text leaves, once the fonts have set the text
document.fonts.ready.then(() => {
  const room = card.querySelector(".nc-photo").getBoundingClientRect(), frame = card.querySelector(".nc-frame");
  const fw = Math.min(room.width, room.height * 16 / 9);
  frame.style.width = `${fw}px`;
  frame.style.height = `${fw * 9 / 16}px`;
  document.body.dataset.ready = "";
});
</script>
</body>
</html>
