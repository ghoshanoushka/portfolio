<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magazine Card</title>
<!-- One project card as a modern magazine cover: the project's colour, one big screenshot, a bold
     headline and very little else. ?p=0..3 picks the project, ?shape=tall the Bulge/Drum card. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800;9..144,900&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }
  .cover {
    position: relative; overflow: hidden; color: #fff; display: flex; flex-direction: column;
    background: radial-gradient(120% 90% at 80% 10%, var(--c2), var(--c1) 70%);
    font-family: Inter, system-ui, sans-serif;
  }
  .wide { width: 540px; height: 460px; padding: 22px 24px 20px; }
  .tall { width: 420px; height: 467px; padding: 20px 20px 18px; }
  /* a soft sheen, like a glossy cover */
  .cover::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 38%, transparent 70%, rgba(255,255,255,.06)); }
  .mast { display: flex; justify-content: space-between; align-items: flex-end; }
  .name { font-family: Fraunces, serif; font-weight: 900; font-size: 54px; line-height: .8; letter-spacing: -.03em; }
  .tall .name { font-size: 46px; }
  .issue { text-align: right; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; line-height: 1.5; opacity: .85; }
  .shot { position: relative; margin: 18px 0 0; flex: 1; min-height: 0; border-radius: 10px; overflow: hidden;
    box-shadow: 0 22px 40px -18px rgba(0, 0, 0, .55); }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .lines { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .kicker { font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .8; }
  h1 { font-family: Fraunces, serif; font-weight: 800; font-size: 30px; line-height: 1.02; letter-spacing: -.015em; }
  .tall h1 { font-size: 26px; }
</style>
</head>
<body>
<div class="cover" id="card"></div>
<script src="stories.js"></script>
<script>
const q = new URLSearchParams(location.search), s = STORIES[+q.get("p") || 0], tall = q.get("shape") === "tall";
const card = document.getElementById("card");
card.className = "cover " + (tall ? "tall" : "wide");
card.style.setProperty("--c1", s.c[0]);
card.style.setProperty("--c2", s.c[1]);
card.innerHTML = `
  <div class="mast"><div class="name">${s.short}</div><div class="issue">${s.status}<br>${s.year}</div></div>
  <div class="shot"><img src="${s.photo}" alt=""></div>
  <div class="lines"><p class="kicker">${s.section}</p><h1>${s.head}</h1></div>`;
</script>
</body>
</html>
